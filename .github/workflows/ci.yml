name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Unit and integration tests (Testcontainers uses the runner's Docker)
        run: npm test

  image:
    name: Docker image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: job-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test static build output inside the image
        run: docker run --rm job-agent:ci node -e "require('node:fs').accessSync('dist/static/index.html'); require('node:fs').accessSync('dist/entrypoints/worker.js'); console.log('image ok')"
